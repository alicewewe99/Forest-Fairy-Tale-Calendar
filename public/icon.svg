<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F3"/>
      <stop offset="100%" stop-color="#F7F1E6"/>
    </linearGradient>

    <!-- Chipmunk Fur Gradient -->
    <linearGradient id="chipmunkFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E89B48"/>
      <stop offset="60%" stop-color="#D57C26"/>
      <stop offset="100%" stop-color="#B86115"/>
    </linearGradient>

    <!-- Calendar Spiral Ring Metallic Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BB3CE"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#497290"/>
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3D2817" flood-opacity="0.14"/>
    </filter>

    <filter id="calendarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="2" dy="12" stdDeviation="16" flood-color="#1A2D42" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- 1. APP ICON SQUIRCLE CONTAINER & BLUE RIM  -->
  <!-- ========================================== -->
  <rect x="44" y="44" width="936" height="936" rx="200" ry="200" 
        fill="url(#bgGrad)" 
        stroke="#9ACDF2" 
        stroke-width="26" 
        filter="url(#cardShadow)" />

  <!-- ========================================== -->
  <!-- 2. LEFT: FLUFFY TAIL OF CHIPMUNK           -->
  <!-- ========================================== -->
  <!-- Tail Back Outer Arc -->
  <g filter="url(#cardShadow)">
    <path d="M 230 740 C 90 710 30 540 100 420 C 150 330 250 340 270 420 C 290 490 220 620 280 710 Z" 
          fill="url(#chipmunkFur)" 
          stroke="#2C1607" 
          stroke-width="11" 
          stroke-linejoin="round"/>
    
    <!-- Tail Inner Dark Stripes & Fluff -->
    <path d="M 120 440 C 160 380 230 400 240 460 C 250 540 180 620 210 700" 
          stroke="#451F06" 
          stroke-width="20" 
          stroke-linecap="round" 
          fill="none"/>
    <path d="M 80 470 C 110 520 120 610 170 680" 
          stroke="#FEE6CD" 
          stroke-width="12" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.7"/>
  </g>

  <!-- ========================================== -->
  <!-- 3. CHIPMUNK (花栗鼠) HEAD & EARS & FACE     -->
  <!-- ========================================== -->
  <!-- Chipmunk Left Ear -->
  <ellipse cx="370" cy="225" rx="46" ry="68" transform="rotate(-18 370 225)" 
           fill="#C76F1D" stroke="#2C1607" stroke-width="10"/>
  <ellipse cx="370" cy="225" rx="26" ry="44" transform="rotate(-18 370 225)" 
           fill="#F9BFB4"/>

  <!-- Chipmunk Right Ear (snuggled towards panda) -->
  <ellipse cx="490" cy="220" rx="42" ry="64" transform="rotate(16 490 220)" 
           fill="#C76F1D" stroke="#2C1607" stroke-width="10"/>
  <ellipse cx="490" cy="220" rx="24" ry="40" transform="rotate(16 490 220)" 
           fill="#F9BFB4"/>

  <!-- Chipmunk Chubby Head Base -->
  <path d="M 270 420 C 220 370 250 250 380 240 C 470 230 530 280 545 350 C 560 410 540 480 490 510 C 420 530 310 510 270 420 Z" 
        fill="url(#chipmunkFur)" 
        stroke="#2C1607" 
        stroke-width="11"/>

  <!-- Cheeks Cream Fluff (Chubby Cute Cheeks) -->
  <ellipse cx="295" cy="425" rx="72" ry="68" fill="#FFF3E2" stroke="#2C1607" stroke-width="9"/>
  <ellipse cx="495" cy="425" rx="66" ry="64" fill="#FFF3E2" stroke="#2C1607" stroke-width="9"/>
  <!-- Chin / Muzzle Cream Fur -->
  <ellipse cx="395" cy="445" rx="78" ry="58" fill="#FFF3E2"/>

  <!-- 3 Dark Brown Forehead Stripes -->
  <!-- Center stripe -->
  <path d="M 405 242 L 405 350" stroke="#3D1D06" stroke-width="17" stroke-linecap="round"/>
  <!-- Left diagonal stripe -->
  <path d="M 360 258 C 362 290 370 325 380 345" stroke="#3D1D06" stroke-width="12" stroke-linecap="round"/>
  <!-- Right diagonal stripe -->
  <path d="M 450 258 C 448 290 440 325 430 345" stroke="#3D1D06" stroke-width="12" stroke-linecap="round"/>

  <!-- Chipmunk Happy Closed Smiling Eyes (^^) -->
  <path d="M 320 375 C 335 350 365 350 380 375" 
        stroke="#2A1606" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M 425 375 C 440 350 470 350 485 375" 
        stroke="#2A1606" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- Chipmunk Rosy Cheeks (Pink Blush) -->
  <ellipse cx="285" cy="410" rx="30" ry="24" fill="#FF758F" opacity="0.82"/>
  <ellipse cx="495" cy="410" rx="30" ry="24" fill="#FF758F" opacity="0.82"/>

  <!-- Chipmunk Tiny Nose -->
  <ellipse cx="402" cy="396" rx="12" ry="9" fill="#3D1D06"/>

  <!-- Chipmunk Open Smiling Mouth & Tongue -->
  <path d="M 384 414 Q 402 428 420 414" stroke="#2A1606" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 386 418 Q 402 452 418 418 Z" fill="#D9384E" stroke="#2A1606" stroke-width="6"/>
  <path d="M 390 430 Q 402 448 414 430 Q 402 422 390 430 Z" fill="#FF8FA3"/>


  <!-- ========================================== -->
  <!-- 4. PANDA (貓熊) HEAD, EARS, EYE PATCHES    -->
  <!-- ========================================== -->
  <!-- Panda Left Ear -->
  <circle cx="675" cy="195" r="62" fill="#202127" stroke="#16171B" stroke-width="9"/>
  <circle cx="682" cy="190" r="46" fill="#2C2D35"/>

  <!-- Panda Right Ear -->
  <circle cx="875" cy="285" r="62" fill="#202127" stroke="#16171B" stroke-width="9"/>
  <circle cx="870" cy="280" r="46" fill="#2C2D35"/>

  <!-- Panda Head (Plush White Face) -->
  <ellipse cx="735" cy="385" rx="170" ry="160" fill="#FFFFFF" stroke="#202127" stroke-width="11"/>

  <!-- Panda Black Eye Patches (Angled Ovals) -->
  <ellipse cx="660" cy="365" rx="46" ry="60" transform="rotate(22 660 365)" fill="#202127"/>
  <ellipse cx="805" cy="390" rx="46" ry="60" transform="rotate(-20 805 390)" fill="#202127"/>

  <!-- Panda White Smiling Happy Eyes (^^ inside patches) -->
  <path d="M 640 365 C 650 345 675 345 685 365" 
        stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M 785 390 C 795 370 820 370 830 390" 
        stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>

  <!-- Panda Rosy Cheeks (Pink Blush on White Fur) -->
  <circle cx="620" cy="425" r="34" fill="#FF758F" opacity="0.82"/>
  <circle cx="845" cy="445" r="34" fill="#FF758F" opacity="0.82"/>

  <!-- Panda Cute Nose -->
  <ellipse cx="732" cy="406" rx="16" ry="12" fill="#1A1B22"/>

  <!-- Panda Open Smiling Mouth & Tongue -->
  <path d="M 714 424 Q 732 436 750 424" stroke="#202127" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 716 426 Q 732 464 748 426 Z" fill="#D9384E" stroke="#202127" stroke-width="6"/>
  <path d="M 720 440 Q 732 460 744 440 Q 732 432 720 440 Z" fill="#FF8FA3"/>

  <!-- Panda Black Body / Shoulder Peeking Behind Calendar -->
  <path d="M 830 480 C 880 520 920 620 920 730" stroke="#202127" stroke-width="48" stroke-linecap="round" fill="none"/>


  <!-- ========================================== -->
  <!-- 5. DESKTOP TENT CALENDAR (立體桌上型月曆)   -->
  <!-- ========================================== -->
  <!-- Easel Triangular Stand Behind Calendar -->
  <path d="M 235 885 L 815 885 L 850 895 L 210 895 Z" fill="#1C334E"/>
  <polygon points="790,560 840,885 780,885" fill="#244265"/>

  <!-- Calendar Page Outer Card (Slanted 3D Perspective) -->
  <g filter="url(#calendarShadow)">
    <polygon points="230,470 805,525 785,910 215,865" 
             fill="#FFFFFF" 
             stroke="#1D334D" 
             stroke-width="11" 
             stroke-linejoin="round"/>
  </g>

  <!-- Calendar Top Title Banner -->
  <polygon points="232,473 803,528 798,590 229,535" 
           fill="#FAF2E2" 
           stroke="#1D334D" 
           stroke-width="7"/>
  <line x1="229" y1="535" x2="798" y2="590" stroke="#1D334D" stroke-width="8"/>

  <!-- "DAILY 🐾 CALENDAR" Text on Banner (tilted to match calendar slope) -->
  <g transform="rotate(5.5 510 535)">
    <!-- "DAILY" -->
    <text x="355" y="528" 
          font-family="'M PLUS Rounded 1c', 'Arial Rounded MT Bold', sans-serif" 
          font-weight="900" 
          font-size="36" 
          fill="#4D270B" 
          text-anchor="middle" 
          letter-spacing="2">DAILY</text>

    <!-- Center Paw Print (1 Pad + 4 Toes) -->
    <g fill="#6B3F1B">
      <ellipse cx="505" cy="522" rx="14" ry="11"/>
      <circle cx="488" cy="502" r="5.5"/>
      <circle cx="499" cy="494" r="5.5"/>
      <circle cx="511" cy="494" r="5.5"/>
      <circle cx="522" cy="502" r="5.5"/>
    </g>

    <!-- "CALENDAR" -->
    <text x="655" y="528" 
          font-family="'M PLUS Rounded 1c', 'Arial Rounded MT Bold', sans-serif" 
          font-weight="900" 
          font-size="36" 
          fill="#4D270B" 
          text-anchor="middle" 
          letter-spacing="2">CALENDAR</text>
  </g>

  <!-- ========================================== -->
  <!-- 6. CALENDAR SPIRAL WIRE RINGS (銀色金屬雙線圈)-->
  <!-- ========================================== -->
  <!-- 10 Metallic Double-Ring Loops across top -->
  <!-- Punch holes & rings -->
  <g stroke="#1D334D" stroke-width="7" stroke-linecap="round" fill="none">
    <!-- Ring 1 -->
    <path d="M 285 450 C 285 425 305 425 305 485" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 2 -->
    <path d="M 335 455 C 335 430 355 430 355 490" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 3 -->
    <path d="M 385 460 C 385 435 405 435 405 495" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 4 -->
    <path d="M 435 465 C 435 440 455 440 455 500" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 5 -->
    <path d="M 485 470 C 485 445 505 445 505 505" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 6 -->
    <path d="M 535 475 C 535 450 555 450 555 510" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 7 -->
    <path d="M 585 480 C 585 455 605 455 605 515" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 8 -->
    <path d="M 635 485 C 635 460 655 460 655 520" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 9 -->
    <path d="M 685 490 C 685 465 705 465 705 525" stroke="url(#ringGrad)" stroke-width="11"/>
    <!-- Ring 10 -->
    <path d="M 735 495 C 735 470 755 470 755 530" stroke="url(#ringGrad)" stroke-width="11"/>
  </g>

  <!-- ========================================== -->
  <!-- 7. CALENDAR GRID & HOLIDAY CELL HIGHLIGHTS -->
  <!-- ========================================== -->
  <!-- Pink Weekday Header Row -->
  <polygon points="252,550 782,600 778,635 248,585" fill="#F8C6BC" opacity="0.9"/>

  <!-- Grid Cells Inner Lines -->
  <g stroke="#DEC8B8" stroke-width="4.5" opacity="0.85">
    <!-- Horizontal Row Dividers -->
    <line x1="245" y1="635" x2="774" y2="685"/>
    <line x1="240" y1="685" x2="768" y2="735"/>
    <line x1="234" y1="735" x2="762" y2="785"/>
    <line x1="228" y1="785" x2="756" y2="835"/>
    <line x1="222" y1="835" x2="750" y2="885"/>

    <!-- Vertical Column Dividers -->
    <line x1="324" y1="557" x2="295" y2="840"/>
    <line x1="398" y1="564" x2="370" y2="847"/>
    <line x1="472" y1="571" x2="445" y2="854"/>
    <line x1="546" y1="578" x2="520" y2="861"/>
    <line x1="620" y1="585" x2="595" y2="868"/>
    <line x1="694" y1="592" x2="670" y2="875"/>
  </g>

  <!-- Cell "7": Pink Highlighted Holiday with Red "7" (Exactly like IMG_4566) -->
  <polygon points="245,635 321,642 316,689 240,682" fill="#F5A4A7"/>
  <text x="281" y="670" 
        font-family="'M PLUS Rounded 1c', sans-serif" 
        font-weight="900" 
        font-size="28" 
        fill="#C2185B" 
        text-anchor="middle">7</text>

  <!-- Cell "21": Pink Highlighted Holiday with Red "21" (Exactly like IMG_4566) -->
  <polygon points="234,735 308,742 301,791 228,784" fill="#F5A4A7"/>
  <text x="268" y="771" 
        font-family="'M PLUS Rounded 1c', sans-serif" 
        font-weight="900" 
        font-size="28" 
        fill="#C2185B" 
        text-anchor="middle">21</text>

  <!-- Bottom Row Heart Icon: Cute Little Red Heart (Exactly like IMG_4566) -->
  <g transform="translate(620, 808) rotate(5) scale(1.35)">
    <path d="M 16 7 C 16 2 24 -1 29 4 C 34 -1 42 2 42 7 C 42 16 29 24 29 24 C 29 24 16 16 16 7 Z" 
          fill="#E63946"/>
  </g>


  <!-- ========================================== -->
  <!-- 8. PAWS RESTING ON & HOLDING THE CALENDAR  -->
  <!-- ========================================== -->
  <!-- Chipmunk Paws on Top Calendar Edge -->
  <!-- Left paw -->
  <g filter="url(#calendarShadow)">
    <ellipse cx="295" cy="485" rx="26" ry="20" fill="#DE8837" stroke="#2C1607" stroke-width="8"/>
    <path d="M 285 475 L 285 495" stroke="#2C1607" stroke-width="5" stroke-linecap="round"/>
    <path d="M 305 475 L 305 495" stroke="#2C1607" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Chipmunk Right paw -->
  <g filter="url(#calendarShadow)">
    <ellipse cx="460" cy="435" rx="26" ry="20" transform="rotate(20 460 435)" fill="#DE8837" stroke="#2C1607" stroke-width="8"/>
    <path d="M 452 425 L 458 445" stroke="#2C1607" stroke-width="5" stroke-linecap="round"/>
    <path d="M 468 425 L 474 445" stroke="#2C1607" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Panda Black Paws on Right of Calendar -->
  <g filter="url(#calendarShadow)">
    <!-- Top grasping paw -->
    <ellipse cx="675" cy="485" rx="28" ry="22" fill="#202127" stroke="#16171B" stroke-width="7"/>
    <!-- Side grasping paw -->
    <ellipse cx="780" cy="510" rx="30" ry="24" transform="rotate(-15 780 510)" fill="#202127" stroke="#16171B" stroke-width="8"/>
  </g>
</svg>
